server:
  port: 8080

spring:
  application:
    name: stay-care

  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info

jwt:
  secret : ${JWT_SECRET1}
  access-token-expiration : 1800000

cors:
  allowed-origins:
    - http://localhost:8080
    - http://localhost:5173