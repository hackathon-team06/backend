spring:
  datasource:
    url: ${DB_URL1}
    username: ${DB_USERNAME1}
    password: ${DB_PASSWORD1}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: never

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-5.5

jwt:
  secret: ${JWT_SECRET1}
  access-token-expiration: 1800000

cors:
  allowed-origins:
    - http://localhost:8080
    - http://localhost:5173

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace