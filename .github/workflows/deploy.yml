name: Deploy to EC2

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean bootJar -x test

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp build/libs/*.jar deploy/app.jar
          cp Dockerfile deploy/Dockerfile

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "SSH connection successful"
            docker --version
            mkdir -p /home/ubuntu/staycare

      - name: Upload files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/*"
          target: "/home/ubuntu/staycare"
          strip_components: 1

      - name: Deploy Docker container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/staycare

            docker build -t staycare-api:latest .

            docker stop staycare-api 2>/dev/null || true
            docker rm staycare-api 2>/dev/null || true

            docker run -d \
              --name staycare-api \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=deploy \
              -e DB_URL2="${{ secrets.DB_URL2 }}" \
              -e DB_USERNAME2="${{ secrets.DB_USERNAME2 }}" \
              -e DB_PASSWORD2="${{ secrets.DB_PASSWORD2 }}" \
              -e JWT_SECRET1="${{ secrets.JWT_SECRET1 }}" \
              -e FIREBASE_SERVICE_ACCOUNT_B64="${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" \
              -e AWS_ACCESS_KEY="${{ secrets.AWS_ACCESS_KEY }}" \
              -e AWS_SECRET_KEY="${{ secrets.AWS_SECRET_KEY }}" \
              -e AWS_REGION="ap-northeast-2" \
              -e AWS_S3_BUCKET="${{ secrets.AWS_S3_BUCKET }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e OPENWEATHER_API_KEY="${{ secrets.OPENWEATHER_API_KEY }}" \
              -e GOOGLE_CLIENT_ID="${{ GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CALENDAR_CLIENT_SECRET="${{ GOOGLE_CALENDAR_CLIENT_SECRET }}" \
              staycare-api:latest

            sleep 20

            docker logs --tail 100 staycare-api
            docker ps

            docker image prune -f