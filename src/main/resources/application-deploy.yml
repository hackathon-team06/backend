server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL2}
    username: ${DB_USERNAME2}
    password: ${DB_PASSWORD2}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: never

logging:
  level:
    root: info
    org.hibernate.SQL: warn

jwt:
  secret: ${JWT_SECRET1}
  access-token-expiration: 1800000

cors:
  allowed-origins:
    - http://localhost:8080
    - http://localhost:5173
    - https://api.staycare.shop