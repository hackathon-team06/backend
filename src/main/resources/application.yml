server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: stay-care

  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info
    com.likelion.staycare: debug

jwt:
  secret : ${JWT_SECRET1}
  access-token-expiration : 1800000
  refresh-token-expiration: 1209600000

cors:
  allowed-origins:
    - http://localhost:8080
    - http://localhost:5173

firebase:
  service-account-b64: ${FIREBASE_SERVICE_ACCOUNT_B64}



weather:
  openweather:
    api-key: ${OPENWEATHER_API_KEY}
    base-url: https://api.openweathermap.org
    lat: 37.5665
    lon: 126.9780

